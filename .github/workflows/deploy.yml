name: Deploy KashiNagri to GitHub Pages

on:
  # Trigger on every push to main
  push:
    branches:
      - main
  # Allow manual trigger from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only allow one deployment at a time; skip queued runs but don't cancel in-progress ones
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build KashiNagri Static Export
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Next.js static export
        run: npm run build
        env:
          # Suppress Next.js telemetry during CI build
          NEXT_TELEMETRY_DISABLED: 1

      - name: Verify output directory contains KashiNagri content
        run: |
          echo "--- Listing out/ directory ---"
          ls -la out/
          echo ""
          echo "--- Checking index.html exists ---"
          test -f out/index.html && echo "✅ index.html found" || (echo "❌ index.html NOT found" && exit 1)
          echo ""
          echo "--- Checking index.html contains KashiNagri content ---"
          grep -i "kashinagri\|kashi" out/index.html | head -5 && echo "✅ KashiNagri content confirmed" || echo "⚠️  KashiNagri text not found in index.html head"
          echo ""
          echo "--- Checking key route directories ---"
          test -d out/explore && echo "✅ /explore exists" || echo "⚠️  /explore missing"
          test -d out/eat && echo "✅ /eat exists" || echo "⚠️  /eat missing"
          test -d out/stay && echo "✅ /stay exists" || echo "⚠️  /stay missing"
          test -d out/walks && echo "✅ /walks exists" || echo "⚠️  /walks missing"
          test -d out/move && echo "✅ /move exists" || echo "⚠️  /move missing"
          test -d out/plan && echo "✅ /plan exists" || echo "⚠️  /plan missing"
          echo ""
          echo "--- Build verification complete ---"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the static export output directory
          path: out/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
